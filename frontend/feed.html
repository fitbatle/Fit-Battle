<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://*:5000; connect-src 'self' http://*:5000; font-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitBattle - Feed</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="feed.css">
  <script src="config.js" defer></script>
  <script src="api.js" defer></script>
  <script src="icones.js" defer></script>
  <script src="shell.js" defer></script>
  <script src="compartilhar.js" defer></script>
  <script src="feed.js" defer></script>
  <link rel="icon" href="favicon.png" type="image/png">
</head>
<body data-pagina="feed">
<main>

  <section class="card feed-banner">
    <div class="feed-banner__texto">
      <h1 id="feedSaudacao">Bem-vindo de volta!</h1>
      <p id="feedSubtitulo">Carregando o seu progresso...</p>
      <div id="feedChips"></div>
    </div>
    <div class="feed-banner__acao">
      <button type="button" class="btn btn--primario" id="btnNovoTreino">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Registrar Treino de Hoje
      </button>
    </div>
  </section>

  <div class="feed-layout">
    <section class="feed-lista" id="feedLista" aria-label="Feed de treinos">
      <p class="estado-vazio">Carregando o feed...</p>
    </section>

    <aside class="feed-lateral">
      <div class="card card--interno">
        <div class="lateral-card__cabecalho">
          <span class="lateral-card__titulo">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-1.04 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98 1.04 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
            Top 3
          </span>
        </div>
        <span class="lateral-card__subtitulo">Ranking global por pontuação total</span>
        <div class="top3-lista" id="top3Lista">
          <p class="estado-vazio">Carregando...</p>
        </div>
        <a href="ranking.html" class="btn btn--secundario btn--bloco btn--pequeno">Ver Ranking Completo</a>
      </div>

    </aside>
  </div>

</main>

<div class="overlay" id="overlayTreino">
  <div class="modal-termo modal-termo--estreito">
    <button type="button" class="modal-close" id="closeTreino" aria-label="Fechar">&times;</button>
    <h2 class="modal-title">Registrar treino</h2>
    <form id="formTreino" novalidate>
      <div class="campo">
        <label class="campo__rotulo" for="treinoTipo">Tipo</label>
        <select class="input select" id="treinoTipo">
          <option value="musculacao">Musculação</option>
          <option value="cardio">Cardio</option>
          <option value="yoga">Yoga</option>
          <option value="outro">Outro</option>
        </select>
      </div>
      <div class="campo">
        <label class="campo__rotulo" for="treinoTitulo">Título / grupo</label>
        <input class="input" type="text" id="treinoTitulo" placeholder="Ex: Peito, Corrida" required>
      </div>
      <div class="campo">
        <label class="campo__rotulo" for="treinoDesc">Descrição</label>
        <textarea class="input" id="treinoDesc" placeholder="Como foi o treino?"></textarea>
      </div>
      <div class="campo">
        <label class="campo__rotulo" for="treinoHoras">Duração</label>
        <div class="campo-duplo">
          <input class="input" type="number" id="treinoHoras" min="0" max="23" placeholder="0" aria-label="Horas">
          <span>h</span>
          <input class="input" type="number" id="treinoMinutos" min="0" max="59" placeholder="0" aria-label="Minutos">
          <span>min</span>
        </div>
      </div>
      <div class="campo-linha" id="linhaForca">
        <div class="campo">
          <label class="campo__rotulo" for="treinoCarga">Carga máx. (kg)</label>
          <input class="input" type="number" id="treinoCarga" min="0" step="0.1">
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="treinoReps">Séries / repetições</label>
          <input class="input" type="number" id="treinoReps" min="0">
        </div>
      </div>
      <div class="campo" id="campoDist">
        <label class="campo__rotulo" for="treinoKm">Distância</label>
        <div class="campo-duplo">
          <input class="input" type="number" id="treinoKm" min="0" placeholder="0" aria-label="Quilômetros">
          <span>km</span>
          <input class="input" type="number" id="treinoMetros" min="0" max="999" placeholder="0" aria-label="Metros">
          <span>m</span>
        </div>
      </div>
      <p class="mensagem-form" id="erroTreino" role="alert" aria-live="polite"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn--secundario" id="cancelarTreino">Cancelar</button>
        <button type="submit" class="btn btn--primario">Registrar treino</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
